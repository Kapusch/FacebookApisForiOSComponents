name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_pack_ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        # Pinned: the native artifacts must stay consumable by Xcode 26.3 toolchains.
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.203"

      - name: Scan public tree
        env:
          KAPUSCH_PRIVATE_TERMS: ${{ secrets.KAPUSCH_PRIVATE_TERMS }}
        run: python3 scripts/verify-public.py

      - name: Validate feature selection
        run: bash tests/validate-feature-selection.sh

      - name: Managed Login request tests
        run: dotnet test tests/SignInRequests.Tests/SignInRequests.Tests.csproj

      - name: Install iOS workload
        run: |
          dotnet workload install ios --version 10.0.203

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}

      - name: Cache pinned Facebook SDK archives
        uses: actions/cache@v4
        with:
          path: |
            src/Kapusch.FacebookApisForiOSComponents/Native/iOS/.cache/downloads
          key: ${{ runner.os }}-facebook-ios-sdk-${{ hashFiles('DependencyLocks/iOS/lockstate.txt') }}

      - name: Build iOS wrapper
        run: |
          bash src/Kapusch.FacebookApisForiOSComponents/Native/iOS/build.sh

      - name: Collect Facebook xcframeworks
        run: |
          bash src/Kapusch.FacebookApisForiOSComponents/Native/iOS/collect-facebook-xcframeworks.sh

      - name: Pack
        run: |
          dotnet pack src/Kapusch.FacebookApisForiOSComponents/Kapusch.FacebookApisForiOSComponents.csproj \
            -c Release \
            -o artifacts/nuget

      - name: Validate package
        run: python3 scripts/validate-package.py

      - name: Build sample (simulator) and check its native entry points
        run: |
          dotnet build samples/Kapusch.Facebook.iOS.Sample/Kapusch.Facebook.iOS.Sample.csproj \
            -c Debug \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:EnableCodeSigning=false
          python3 scripts/verify-app-symbols.py \
            samples/Kapusch.Facebook.iOS.Sample/bin/Debug/net10.0-ios/iossimulator-arm64/Kapusch.Facebook.iOS.Sample.app/Kapusch.Facebook.iOS.Sample

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget/*.nupkg
