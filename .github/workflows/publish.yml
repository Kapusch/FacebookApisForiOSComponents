name: publish

on:
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Force a specific version for NuGet.org publish (e.g., 1.0.0 or 1.0.0-rc.1). If empty, defaults to auto-generated preview for GitHub Packages.'
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  pack_and_publish:
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine package version
        id: version
        shell: bash
        run: |
          REF="${{ github.ref }}"
          MANUAL_VERSION="${{ github.event.inputs.manual_version }}"
          CSPROJ="src/Kapusch.FacebookApisForiOSComponents/Kapusch.FacebookApisForiOSComponents.csproj"
          BASE_VERSION=$(grep -oE '<Version>[^<]+' "$CSPROJ" | head -n 1 | sed 's/<Version>//' || echo "0.1.0")

          if [[ -n "$MANUAL_VERSION" ]]; then
            VERSION="$MANUAL_VERSION"
            PUBLISH_TARGET="nuget"
            echo "Manual version provided ($VERSION). Triggering NuGet.org publish."
          elif [[ "$REF" =~ ^refs/tags/v ]]; then
            VERSION="${REF#refs/tags/v}"
            PUBLISH_TARGET="nuget"
          else
            COMMIT_SHORT=$(git rev-parse --short HEAD)
            RUN_NUMBER="${{ github.run_number }}"
            VERSION="${BASE_VERSION}-preview.${RUN_NUMBER}.${COMMIT_SHORT}"
            PUBLISH_TARGET="github"
          fi

          if [[ "$PUBLISH_TARGET" == "nuget" ]]; then
            git fetch origin master
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
              echo "ERROR: NuGet.org releases must be reachable from origin/master."
              exit 1
            fi
            if [[ -n "$MANUAL_VERSION" && "$REF" != "refs/heads/master" ]]; then
              echo "ERROR: Manual NuGet.org releases must be dispatched from master."
              exit 1
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish_target=${PUBLISH_TARGET}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"
          echo "Publish target: ${PUBLISH_TARGET}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate feature selection
        run: bash tests/validate-feature-selection.sh

      - name: Install iOS workload
        run: |
          dotnet workload install ios

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}

      - name: Cache SwiftPM scratch
        uses: actions/cache@v4
        with:
          path: |
            src/Kapusch.FacebookApisForiOSComponents/Native/iOS/build/spm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('src/Kapusch.FacebookApisForiOSComponents/Native/iOS/KapuschFacebookAuthInterop/Package.resolved') }}

      - name: Build iOS wrapper
        run: |
          bash src/Kapusch.FacebookApisForiOSComponents/Native/iOS/build.sh

      - name: Collect Facebook xcframeworks
        run: |
          bash src/Kapusch.FacebookApisForiOSComponents/Native/iOS/collect-facebook-xcframeworks.sh

      - name: Pack
        run: |
          dotnet pack src/Kapusch.FacebookApisForiOSComponents/Kapusch.FacebookApisForiOSComponents.csproj \
            -c Release \
            -o artifacts/nuget \
            /p:PackageVersion="${{ steps.version.outputs.version }}"

      - name: Validate nupkg layout
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile

          nupkgs = glob.glob("artifacts/nuget/*.nupkg")
          if not nupkgs:
            print("ERROR: no .nupkg found under artifacts/nuget/")
            sys.exit(1)

          nupkg = sorted(nupkgs)[-1]
          print(f"Validating {nupkg}")

          z = zipfile.ZipFile(nupkg)
          names = set(z.namelist())

          required = [
            "buildTransitive/Kapusch.Facebook.iOS.targets",
            "kfb.xcframework/Info.plist",
            "kfbshare.xcframework/Info.plist",
            "fb/FBAEMKit.xcframework/Info.plist",
            "fb/FBSDKCoreKit.xcframework/Info.plist",
            "fb/FBSDKCoreKit_Basics.xcframework/Info.plist",
            "fb/FBSDKLoginKit.xcframework/Info.plist",
            "fb/FBSDKShareKit.xcframework/Info.plist",
          ]

          missing = [p for p in required if p not in names]
          if missing:
            print("ERROR: missing required paths in nupkg:")
            for p in missing:
              print(f"  - {p}")
            sys.exit(1)

          if "Info.plist" in names:
            print("ERROR: wrapper appears flattened (found 'Info.plist' at package root).")
            sys.exit(1)

          if any(name.startswith("fb/FBSDKGamingServicesKit.xcframework/") for name in names):
            print("ERROR: GamingServicesKit must not be packaged.")
            sys.exit(1)

          print("OK: nupkg layout looks correct.")
          PY

      - name: Push to NuGet.org
        if: steps.version.outputs.publish_target == 'nuget'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: steps.version.outputs.publish_target == 'nuget'
        run: |
          dotnet nuget push artifacts/nuget/*.nupkg \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Push to GitHub Packages
        if: steps.version.outputs.publish_target == 'github'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push artifacts/nuget/*.nupkg \
            --api-key "$NUGET_AUTH_TOKEN" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
